<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* CARD */
.card {
  background: white;
  width: 90%;
  max-width: 360px;
  padding: 24px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  position: relative;
}

/* QUESTION */
h1 {
  color: #ff4d6d;
  font-size: 22px;
  margin-bottom: 20px;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 120px;
}

/* YES BUTTON (LOCKED CENTER) */
#yes {
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  z-index: 5;
}

/* NO BUTTON */
#no {
  background: #ccc;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 10%;
  bottom: 10px;
  z-index: 1;
}

/* MESSAGE */
#msg {
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 14px;
}

/* YES SCREEN */
#yesScreen {
  display: none;
  text-align: center;
  padding: 20px;
}

#yesScreen h2 {
  color: white;
  margin-bottom: 8px;
}

#yesScreen p {
  color: white;
  margin-bottom: 16px;
}

.gifts {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}

.gifts img {
  width: 90%;
  border-radius: 18px;
}

/* MOBILE */
@media (max-width: 600px) {
  h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<!-- MAIN CARD -->
<div class="card" id="mainCard">
  <h1>💘 Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="no">NO</button>
    <button id="yes">YES ✨</button>
  </div>

  <div id="msg">💗 Everyone knows the answer</div>
</div>

<!-- YES PAGE -->
<div id="yesScreen">
  <h2>💖 SHE SAID YES 💖</h2>
  <p>Best moment ever 😍</p>
  <p>Party Time 😍</p>

  <div class="gifts">
     <video 
    src="maza_aa_gaya.mp4"
    autoplay
    muted
    loop
    playsinline
    controls
    style="width:90%; border-radius:18px;">
  </video>
    <img src="18.gif" alt="Gift 2">
    <img src="source.gif" alt="Gift 3">
    <img src="e454c6822f8d5b4acd623c533304885c.gif" alt="Gift 4">
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");
const card = document.getElementById("mainCard");
const yesScreen = document.getElementById("yesScreen");

const messages = [
  "😂 Nice try, press NO again",
  "😜 Still no?",
  "🤭 You’re enjoying this, right?",
  "😏 Nope, try harder",
  "🙈 Almost got it!"
];

let count = 0;

/* MOVE NO BUTTON — SAFE ZONE ONLY */
noBtn.addEventListener("click", () => {
  const buttonAreaWidth = 320;
  const buttonAreaHeight = 70;

  let x;

  // LEFT or RIGHT only (never center)
  if (Math.random() > 0.5) {
    x = Math.random() * 60;          // LEFT SIDE
  } else {
    x = 220 + Math.random() * 40;   // RIGHT SIDE
  }

  const y = Math.random() * buttonAreaHeight;

  noBtn.style.left = x + "px";
  noBtn.style.bottom = y + "px";

  msg.textContent = messages[count % messages.length];
  count++;

  if (navigator.vibrate) {
    navigator.vibrate(80);
  }
});

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  card.style.display = "none";
  yesScreen.style.display = "block";
});
</script>

</body>
</html>
