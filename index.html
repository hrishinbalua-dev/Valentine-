l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
*{
  box-sizing:border-box;
  font-family:Poppins, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
}

.card{
  background:#fff;
  padding:26px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
  color:#ff4d6d;
  margin-bottom:28px;
}

.buttons{
  position:relative;
  height:170px;
}

/* COMMON BUTTON */
button{
  padding:14px 28px;
  font-size:16px;
  border:none;
  border-radius:32px;
  cursor:pointer;
  position:absolute;
  user-select:none;
}

/* YES – FIXED CENTER & TOP */
#yes{
  background:#ff4d6d;
  color:#fff;
  left:50%;
  transform:translateX(-50%);
  top:0;
  z-index:3;
}

/* NO – ALWAYS BELOW YES */
#no{
  background:#ccc;
  color:#333;
  top:85px;   /* 👈 different row */
  left:10px;
  z-index:1;
}

#noMessage{
  margin-top:15px;
  min-height:22px;
  color:#ff4d6d;
  font-size:15px;
  font-weight:500;
}

/* Confetti */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  animation:fall 3s linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10vh) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="card">
  <h2>💘 Will you be my Valentine? 💘</h2>

  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 😜</button>
  </div>

  <p id="noMessage"></p>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const box = document.querySelector(".buttons");
const msg = document.getElementById("noMessage");
const card = document.querySelector(".card");

let noCount = 0;
let moving = false;

const messages = [
  "😜 Press NO again",
  "😝 Still choosing NO?",
  "😂 Almost YES!",
  "🙈 NO is scared",
  "😏 Come on…",
  "🤭 Try harder",
  "💗 Everyone knows",
  "🥺 Don’t lie",
  "😍 Just say YES"
];

function moveNo(e){
  e.preventDefault();
  e.stopPropagation();
  if(moving) return;
  moving = true;

  noCount++;

  // 📳 vibration
  if(navigator.vibrate){
    navigator.vibrate([40,20,40]);
  }

  const boxWidth = box.offsetWidth;
  const buttonWidth = noBtn.offsetWidth;

  // SAFE horizontal range ONLY
  const minX = 10;
  const maxX = boxWidth - buttonWidth - 10;

  let x = Math.random() * (maxX - minX) + minX;

  noBtn.style.left = x + "px";

  msg.textContent = messages[Math.min(noCount-1, messages.length-1)];

  if(noCount >= 6){
    yesBtn.style.transform = "translateX(-50%) scale(1.25)";
  }

  setTimeout(()=>moving=false,120);
}

noBtn.addEventListener("touchstart", moveNo, { passive:false });
noBtn.addEventListener("mousedown", moveNo);

yesBtn.addEventListener("click", ()=>{
  card.innerHTML = `
    <h2>💖 YAYYYY 💖</h2>
    <p style="font-size:18px">
      I knew it 😌<br>
      Happy Valentine’s 💕
    </p>
  `;
  startConfetti();
});

function startConfetti(){
  for(let i=0;i<90;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.backgroundColor=
      ["#ff4d6d","#ffb703","#ffd166","#06d6a0"]
      [Math.floor(Math.random()*4)];
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
