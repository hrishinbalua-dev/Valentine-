<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow-x: hidden;
}

/* PAGE */
.page {
  padding: 40px 16px 80px;
}

/* CARD */
.card {
  background: white;
  max-width: 360px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,.2);
}

/* QUESTION */
h1 {
  color: #ff4d6d;
  font-size: 22px;
  margin-bottom: 20px;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 120px;
}

/* YES BUTTON */
#yes {
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 5;
}

/* NO BUTTON */
#no {
  background: #ccc;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 10%;
  bottom: 0;
  z-index: 1;
}

/* MESSAGE */
#msg {
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 14px;
  min-height: 20px;
}

/* YES SCREEN */
#yesScreen {
  display: none;
  text-align: center;
  margin-top: 60px;
}

#yesScreen h2 {
  color: white;
  font-size: 30px;
  margin-bottom: 12px;
}

#yesScreen p {
  color: white;
  font-size: 18px;
  margin-bottom: 10px;
}

/* GIFS & VIDEO */
.gifts {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

video, img {
  width: 100%;
  max-width: 360px;
  border-radius: 18px;
  display: block;
}

/* VIDEO FIX */
video {
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: black;
}

/* 💖 CONFETTI */
.confetti {
  position: fixed;
  top: -10px;
  font-size: 14px;
  pointer-events: none;
  opacity: 0.85;
  animation: fall linear forwards;
  z-index: 9999;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* MOBILE */
@media (max-width: 600px) {
  h1 { font-size: 20px; }
}
</style>
</head>

<body>

<div class="page">

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">
    <h1>💘 Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="no">NO</button>
      <button id="yes">YES ✨</button>
    </div>

    <div id="msg">💗 Everyone knows the answer</div>
  </div>

  <!-- YES SCREEN -->
  <div id="yesScreen">
    <h2>💖 SHE SAID YES 💖</h2>
    <p>Best moment ever 😍</p>
    <p>Party Time 😍</p>

    <div class="gifts">
      <video id="celebrateVideo"
        src="maza_aa_gaya.mp4"
        controls
        playsinline
        loop>
      </video>

      <img src="18.gif">
      <img src="source.gif">
      <img src="e454c6822f8d5b4acd623c533304885c.gif">
    </div>
  </div>

</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");
const card = document.getElementById("mainCard");
const yesScreen = document.getElementById("yesScreen");
const buttons = document.querySelector(".buttons");

const messages = [
  "😂 Nice try, press NO again",
  "😜 Still no?",
  "🤭 Almost YES",
  "😏 You know it",
  "🙈 Just press YES"
];

let i = 0;
let lastX = null;
let lastY = null;
let confettiInterval = null;

/* 🏃 MOVE NO RANDOMLY (USED BY CLICK + HOVER) */
function moveNoRandomly() {
  const btnBox = buttons.getBoundingClientRect();
  const noBox = noBtn.getBoundingClientRect();
  const yesBox = yesBtn.getBoundingClientRect();

  let x, y, safe = false;

  while (!safe) {
    x = Math.random() * (btnBox.width - noBox.width);
    y = Math.random() * 40;

    if (lastX !== null) {
      if (Math.abs(x - lastX) < 120 && Math.abs(y - lastY) < 30) continue;
    }

    const futureNo = {
      left: btnBox.left + x,
      right: btnBox.left + x + noBox.width,
      top: btnBox.bottom - y - noBox.height,
      bottom: btnBox.bottom - y
    };

    if (
      futureNo.right < yesBox.left ||
      futureNo.left > yesBox.right ||
      futureNo.bottom < yesBox.top ||
      futureNo.top > yesBox.bottom
    ) {
      safe = true;
    }
  }

  noBtn.style.left = x + "px";
  noBtn.style.bottom = y + "px";
  lastX = x;
  lastY = y;
}

/* 📱 MOBILE TAP */
noBtn.addEventListener("click", () => {
  moveNoRandomly();
  msg.textContent = messages[i++ % messages.length];
  if (navigator.vibrate) navigator.vibrate(80);
});

/* 💻 DESKTOP HOVER */
if (window.matchMedia("(hover: hover)").matches) {
  noBtn.addEventListener("mouseenter", moveNoRandomly);
}

/* 💖 CONFETTI LOOP */
function startConfetti() {
  if (confettiInterval) return;

  const hearts = ["💖","💗","💘"];

  confettiInterval = setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "confetti";
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 400);
}

/* ❤️ YES CLICK */
yesBtn.addEventListener("click", () => {
  history.pushState({ page: "yes" }, "", "#yes");

  card.style.display = "none";
  yesScreen.style.display = "block";
  yesScreen.scrollIntoView({ behavior: "smooth" });

  if (navigator.vibrate) navigator.vibrate(300);

  startConfetti();

  const video = document.getElementById("celebrateVideo");
  if (video) {
    video.muted = false;
    video.currentTime = 0;
    video.play().catch(() => {});
  }
});

/* ⬅ BACK BUTTON FIX */
window.addEventListener("popstate", () => {
  yesScreen.style.display = "none";
  card.style.display = "block";
  window.scrollTo({ top: 0 });

  const video = document.getElementById("celebrateVideo");
  if (video) {
    video.pause();
    video.currentTime = 0;
  }

  if (confettiInterval) {
    clearInterval(confettiInterval);
    confettiInterval = null;
  }

  document.querySelectorAll(".confetti").forEach(c => c.remove());
});
</script>

</body>
</html>
