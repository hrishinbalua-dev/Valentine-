<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: Poppins, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.page {
  padding: 40px 16px;
}

/* CARD */
.card {
  background: white;
  max-width: 360px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,.2);
}

/* BUTTON AREA */
.buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

/* BUTTONS */
button {
  flex: 1;
  padding: 12px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #ccc;
}

/* MESSAGE */
#msg {
  margin-top: 15px;
  color: #ff4d6d;
  min-height: 20px;
}

/* YES SCREEN */
#yesScreen {
  display: none;
  text-align: center;
  margin-top: 40px;
}

.gifts {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

video, img {
  width: 100%;
  border-radius: 18px;
}
</style>
</head>

<body>

<div class="page">

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">
    <h2>💘 Will you be my Valentine? 💘</h2>

    <div class="buttons">
      <button id="no">NO</button>
      <button id="yes">YES ✨</button>
    </div>

    <div id="msg">💗 Everyone knows the answer</div>
  </div>

  <!-- YES SCREEN -->
  <div id="yesScreen">
    <h2>💖 SHE SAID YES 💖</h2>
    <p>Best moment ever 😍</p>

    <div class="gifts">
      <video id="celebrateVideo" src="maza_aa_gaya.mp4" controls playsinline></video>
      <img src="18.gif">
      <img src="source.gif">
      <img src="e454c6822f8d5b4acd623c533304885c.gif">
    </div>
  </div>

</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const msg = document.getElementById("msg");
const card = document.getElementById("mainCard");
const yesScreen = document.getElementById("yesScreen");

const messages = [
  "😂 Nice try",
  "😜 Still no?",
  "🤭 Almost YES",
  "😏 You know it",
  "🙈 Just press YES"
];

let i = 0;

/* NO CLICK — SIMPLE & RELIABLE */
noBtn.addEventListener("click", () => {
  msg.textContent = messages[i++ % messages.length];
  if (navigator.vibrate) navigator.vibrate(80);
});

/* YES CLICK — ALWAYS WORKS */
yesBtn.addEventListener("click", () => {
  card.style.display = "none";
  yesScreen.style.display = "block";

  const video = document.getElementById("celebrateVideo");
  if (video) {
    video.currentTime = 0;
    video.play().catch(() => {});
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
