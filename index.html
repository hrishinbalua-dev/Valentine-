<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* BODY — SCROLL ENABLED */
body {
  margin: 0;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow-y: auto;
  overflow-x: hidden;
}

/* PAGE */
.page {
  min-height: 100vh;
  padding: 40px 16px;
}

/* CARD */
.card {
  background: white;
  max-width: 360px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

/* QUESTION */
h1 {
  color: #ff4d6d;
  font-size: 22px;
  margin-bottom: 20px;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 120px;
  margin-bottom: 10px;
}

/* YES */
#yes {
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 5;
}

/* NO */
#no {
  background: #ccc;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 10%;
  bottom: 0;
  z-index: 1;
}

/* MESSAGE */
#msg {
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 14px;
}

/* YES SCREEN */
#yesScreen {
  display: none;
  text-align: center;
  margin-top: 60px;
}

/* YES TEXT */
#yesScreen h2,
#yesScreen p {
  color: white;
}

/* GIF + VIDEO */
.gifts {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
  margin-top: 20px;
}

.gifts img,
.gifts video {
  width: 90%;
  border-radius: 18px;
}

/* MOBILE */
@media (max-width: 600px) {
  h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">
    <h1>💘 Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="no">NO</button>
      <button id="yes">YES ✨</button>
    </div>

    <div id="msg">💗 Everyone knows the answer</div>
  </div>

  <!-- YES PAGE (SCROLLABLE CONTENT) -->
  <div id="yesScreen">
    <h2>💖 SHE SAID YES 💖</h2>
    <p>Best moment ever 😍</p>
    <p>Party Time 😍</p>

    <div class="gifts">
<video 
  id="celebrateVideo"
  src="maza_aa_gaya.mp4"
  loop
  playsinline
  controls
  style="width:90%; border-radius:18px;">
</video>

      <img src="18.gif">
      <img src="source.gif">
      <img src="e454c6822f8d5b4acd623c533304885c.gif">
    </div>
  </div>

</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");
const card = document.getElementById("mainCard");
const yesScreen = document.getElementById("yesScreen");

const messages = [
  "😂 Nice try, press NO again",
  "😜 Still no?",
  "🤭 You’re enjoying this, right?",
  "😏 Nope, try harder",
  "🙈 Almost got it!"
];

let count = 0;

/* MOVE NO SAFELY */
noBtn.addEventListener("click", () => {
  let x;

  if (Math.random() > 0.5) {
    x = Math.random() * 50;
  } else {
    x = 230 + Math.random() * 40;
  }

  const y = Math.random() * 60;

  noBtn.style.left = x + "px";
  noBtn.style.bottom = y + "px";

  msg.textContent = messages[count % messages.length];
  count++;

  if (navigator.vibrate) navigator.vibrate(80);
});

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  card.style.display = "none";
  yesScreen.style.display = "block";

  const video = document.getElementById("celebrateVideo");
  if (video) {
    video.currentTime = 0;
    video.muted = false;
    video.play();
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
});
  // 👇 force scroll activation
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
