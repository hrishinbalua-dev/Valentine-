<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  font-family:Poppins, Arial, sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
  color:#ff4d6d;
  margin-bottom:25px;
}

.buttons{
  position:relative;
  height:140px;
}

button{
  padding:12px 26px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  position:absolute;
  user-select:none;
}

#yes{
  background:#ff4d6d;
  color:#fff;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  z-index:2;
  transition:transform 0.3s;
}

#no{
  background:#ccc;
  color:#333;
  bottom:0;
  z-index:1;
}

#noMessage{
  margin-top:15px;
  min-height:22px;
  color:#ff4d6d;
  font-size:15px;
  font-weight:500;
}

/* Confetti */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  animation:fall 3s linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10vh) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="card">
  <h2>💘 Will you be my Valentine? 💘</h2>

  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 😜</button>
  </div>

  <p id="noMessage"></p>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const box = document.querySelector(".buttons");
const msg = document.getElementById("noMessage");
const card = document.querySelector(".card");

let noCount = 0;
let moving = false;

// 🔥 MANY teasing messages
const messages = [
  "😜 Press NO again",
  "😝 Still choosing NO?",
  "😆 Almost clicked YES!",
  "🙈 NO is shy today",
  "😂 You’re enjoying this, right?",
  "😏 Come on…",
  "🤭 Just one YES?",
  "💗 Everyone knows the answer",
  "🥺 Stop teasing me",
  "😍 Okay okay… YES?"
];

// Initial NO position
noBtn.style.left = "10px";

function moveNo(e){
  e.preventDefault();
  e.stopPropagation();

  if(moving) return;
  moving = true;

  noCount++;

  // 📳 VIBRATION on NO tap
  if (navigator.vibrate) {
    navigator.vibrate([40, 20, 40]);
  }

  // Temporarily disable YES to prevent accidental press
  yesBtn.style.pointerEvents = "none";

  const boxWidth = box.offsetWidth;
  const yesCenter = boxWidth / 2;
  const safeGap = 90;

  let x;

  // Keep NO only left or right — never near YES
  if(Math.random() < 0.5){
    x = Math.random() * (yesCenter - safeGap);
  } else {
    x = yesCenter + safeGap +
        Math.random() * (boxWidth - yesCenter - safeGap - 70);
  }

  noBtn.style.left = x + "px";

  // 💬 Update message every time
  msg.textContent = messages[Math.min(noCount - 1, messages.length - 1)];

  // Grow YES slowly after many NOs 😏
  if(noCount >= 6){
    yesBtn.style.transform = "translateX(-50%) scale(1.25)";
  }

  setTimeout(()=>{
    yesBtn.style.pointerEvents = "auto";
    moving = false;
  },150);
}

// Mobile-first events
noBtn.addEventListener("touchstart", moveNo, { passive:false });
noBtn.addEventListener("mousedown", moveNo);

// YES click
yesBtn.addEventListener("click", ()=>{
  card.innerHTML = `
    <h2>💖 YAYYYY 💖</h2>
    <p style="font-size:18px">
      I knew it 😌<br>
      Happy Valentine’s 💕
    </p>
  `;
  startConfetti();
});

function startConfetti(){
  for(let i=0;i<90;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.backgroundColor=
      ["#ff4d6d","#ffb703","#ffd166","#06d6a0"]
      [Math.floor(Math.random()*4)];
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
