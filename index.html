<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

h1 {
  color: #ff4d6d;
  font-size: 26px;
}

.buttons {
  position: relative;
  height: 140px;
  margin-top: 30px;
}

button {
  padding: 14px 28px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  transition: 0.25s ease;
}

#yes {
  background: #ff4d6d;
  color: white;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  z-index: 10;
}

#no {
  background: #ccc;
  color: black;
  left: 10%;
  bottom: 0;
  z-index: 5;
}

#msg {
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 16px;
  min-height: 24px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>💘 Will you be my Valentine? 💘</h1>

  <div class="buttons" id="btnBox">
    <button id="yes">YES ✨</button>
    <button id="no">NO</button>
  </div>

  <div id="msg">💖 Everyone knows the answer</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");
const box = document.getElementById("btnBox");

const messages = [
  "😂 Nice try, press NO again",
  "😏 You can’t escape",
  "🙈 Why are you lying?",
  "😜 Still NO?",
  "💖 We both know the truth",
  "🤣 You're enjoying this, right?"
];

let msgIndex = 0;

function moveNoSafely() {
  const boxRect = box.getBoundingClientRect();
  const yesRect = yesBtn.getBoundingClientRect();
  const noRect = noBtn.getBoundingClientRect();

  let x, y, safe;

  do {
    safe = true;

    x = Math.random() * (boxRect.width - noRect.width);
    y = Math.random() * (boxRect.height - noRect.height - 20);

    const futureNo = {
      left: boxRect.left + x,
      right: boxRect.left + x + noRect.width,
      top: boxRect.top + y,
      bottom: boxRect.top + y + noRect.height
    };

    // Check overlap with YES
    if (
      futureNo.right > yesRect.left &&
      futureNo.left < yesRect.right &&
      futureNo.bottom > yesRect.top &&
      futureNo.top < yesRect.bottom
    ) {
      safe = false;
    }

  } while (!safe);

  noBtn.style.left = x + "px";
  noBtn.style.bottom = "auto";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("click", () => {
  if (navigator.vibrate) navigator.vibrate(120);

  moveNoSafely();

  msg.textContent = messages[msgIndex];
  msgIndex = (msgIndex + 1) % messages.length;
});

yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    ">
      <h1 style="color:white;font-size:32px;">💖 SHE SAID YES 💖</h1>
      <p style="color:white;font-size:18px;">Best moment ever 😍</p>

      <div style="
        display:flex;
        flex-direction:column;
        gap:20px;
        max-width:360px;
        width:100%;
        margin-top:20px;
      ">
        <img src="images.jpeg" style="width:100%;border-radius:20px;">
        <img src="source.gif" style="width:100%;border-radius:20px;">
        <img src="e454c682f8db54acd623c533304885c.gif" style="width:100%;border-radius:20px;">
      </div>

      <p style="color:white;margin-top:20px;font-size:18px;">🎁 Just for you 💕</p>
    </div>
  `;

  confetti({
    particleCount: 250,
    spread: 120,
    origin: { y: 0.6 }
  });
});
</script>

</body>
</html>
