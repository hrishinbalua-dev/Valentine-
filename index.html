<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow-x: hidden;
}

/* PAGE WRAPPER */
.page {
  padding: 40px 16px 80px;
}

/* CARD */
.card {
  background: white;
  max-width: 360px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,.2);
}

/* QUESTION */
h1 {
  color: #ff4d6d;
  font-size: 22px;
  margin-bottom: 20px;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 120px;
}

/* YES BUTTON */
#yes {
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 5;
}

/* NO BUTTON */
#no {
  background: #ccc;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
  left: 10%;
  bottom: 0;
  z-index: 1;
}

/* MESSAGE */
#msg {
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 14px;
  min-height: 20px;
}

/* YES SCREEN */
#yesScreen {
  display: none;
  text-align: center;
  margin-top: 60px;
}

#yesScreen h2,
#yesScreen p {
  color: white;
}

/* GIFS & VIDEO */
.gifts {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

video, img {
  width: 100%;
  max-width: 360px;
  border-radius: 18px;
  display: block;
}

/* VIDEO FIX */
video {
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: black;
}

/* MOBILE */
@media (max-width: 600px) {
  h1 { font-size: 20px; }
}
</style>
</head>

<body>

<div class="page">

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">
    <h1>💘 Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="no">NO</button>
      <button id="yes">YES ✨</button>
    </div>

    <div id="msg">💗 Everyone knows the answer</div>
  </div>

  <!-- YES SCREEN -->
  <div id="yesScreen">
    <h2>💖 SHE SAID YES 💖</h2>
    <p>Best moment ever 😍</p>
    <p>Party Time 😍</p>

    <div class="gifts">
      <video id="celebrateVideo"
        src="maza_aa_gaya.mp4"
        controls
        playsinline>
      </video>

      <img src="18.gif" alt="Gift 1">
      <img src="source.gif" alt="Gift 2">
      <img src="e454c6822f8d5b4acd623c533304885c.gif" alt="Gift 3">
    </div>
  </div>

</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");
const card = document.getElementById("mainCard");
const yesScreen = document.getElementById("yesScreen");
const buttons = document.querySelector(".buttons");

const messages = [
  "😂 Nice try, press NO again",
  "😜 Still no?",
  "🤭 Almost YES",
  "😏 You know it",
  "🙈 Just press YES"
];

let i = 0;

/* 🔥 RANDOM SAFE NO MOVEMENT */
noBtn.addEventListener("click", () => {
  const btnBox = buttons.getBoundingClientRect();
  const noBox = noBtn.getBoundingClientRect();
  const yesBox = yesBtn.getBoundingClientRect();

  let x, y, safe = false;

  while (!safe) {
    x = Math.random() * (btnBox.width - noBox.width);
    y = Math.random() * 40;

    const futureNo = {
      left: btnBox.left + x,
      right: btnBox.left + x + noBox.width,
      top: btnBox.bottom - y - noBox.height,
      bottom: btnBox.bottom - y
    };

    if (
      futureNo.right < yesBox.left ||
      futureNo.left > yesBox.right ||
      futureNo.bottom < yesBox.top ||
      futureNo.top > yesBox.bottom
    ) {
      safe = true;
    }
  }

  noBtn.style.left = x + "px";
  noBtn.style.bottom = y + "px";

  msg.textContent = messages[i++ % messages.length];

  if (navigator.vibrate) navigator.vibrate(80);
});

/* ❤️ YES CLICK */
yesBtn.addEventListener("click", () => {
  card.style.display = "none";
  yesScreen.style.display = "block";

  yesScreen.scrollIntoView({ behavior: "smooth" });

  const video = document.getElementById("celebrateVideo");
  if (video) {
    video.muted = false;
    video.currentTime = 0;
    video.play().catch(() => {});
  }
});
</script>

</body>
</html>
